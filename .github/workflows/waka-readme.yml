name: Update WakaTime stats in README

on:
  schedule:
    - cron: "30 18 * * *"  # 12:00 AM IST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # WAKATIME_API_KEY must hold a personal OAuth token from
      # https://wakatime.com/oauth - plain API keys stopped working 2026-11-01.
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG_LOGGING: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "True"
          SHOW_LOC_CHART: "True"
          LOCALE: "en"
          BAR_STYLE: "svg"
          BAR_RADIUS: "4"
          BAR_COLOR: "#58a6ff"
          BAR_TRACK_COLOR: "#161b22"
          BADGE_STYLE: "for-the-badge"
          COMMIT_MESSAGE: "chore: update WakaTime dev metrics"
